<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Wallet / Calculator shape -->
    <rect x="40" y="80" width="432" height="352" rx="36" fill="#ffffff" fill-opacity="0.95" />
    <rect x="80" y="130" width="352" height="90" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="6" />
    <text x="390" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#047857" text-anchor="end">₫ 1 NGÀY</text>
    
    <!-- Keypad / Stats grid -->
    <rect x="80" y="250" width="96" height="70" rx="14" fill="#f1f5f9" />
    <rect x="208" y="250" width="96" height="70" rx="14" fill="#f1f5f9" />
    <rect x="336" y="250" width="96" height="70" rx="14" fill="#059669" />
    
    <rect x="80" y="340" width="96" height="60" rx="14" fill="#f1f5f9" />
    <rect x="208" y="340" width="96" height="60" rx="14" fill="#f1f5f9" />
    <rect x="336" y="340" width="96" height="60" rx="14" fill="url(#gold-grad)" />
    
    <!-- Coin icon overlay -->
    <circle cx="384" cy="285" r="18" fill="#ffffff" />
    <text x="384" y="293" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#059669" text-anchor="middle">✓</text>
  </g>
</svg>
